model:
  provider: openai-responses
  name: gpt-5
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY

agent:
  max_model_calls: 64

# Dora automatically discovers a skills directory beside this file.
# Add other directories only when needed:
# skills:
#   directories:
#     - /absolute/path/to/additional-skills

tools:
  bash:
    # Bash is enabled by default. Uncomment to disable it.
    # enabled: false
    timeout_seconds: 30
  powershell:
    # PowerShell is enabled by default. Uncomment to disable it.
    # enabled: false
    timeout_seconds: 30
