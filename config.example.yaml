model:
  # Omit provider to select the sole provider whose API key environment
  # variable is set. Multiple detected providers require an explicit choice.
  provider: deepseek
  # Defaults shown for reference:
  # api: chat_completions
  # name: deepseek-v4-flash
  # base_url: https://api.deepseek.com
  # api_key_env: DEEPSEEK_API_KEY
  # Other presets: openai, trust

  # Overall timeout (seconds) for a non-streaming generation request.
  # Default: 120.
  # timeout_seconds: 120
  # Timeout (seconds) for establishing the TCP connection. Default: 10.
  # connect_timeout_seconds: 10
  # Maximum idle time (seconds) between streaming events before the stream is
  # considered stalled. 0 disables the idle timeout and leaves the stream
  # governed by the caller's context. Default: 0.
  # stream_idle_timeout_seconds: 0

  # Enable image understanding. Requires a vision-capable model. When true,
  # command tools advertise the @@path@@ image tag and --image is accepted.
  # Default: false.
  # vision: true

agent:
  max_rounds: 256

# Dora automatically discovers a skills directory at ~/.dora/skills
# (or DORA_HOME/skills), independent of this file's location.
# Add other directories only when needed:
# skills:
#   directories:
#     - /absolute/path/to/additional-skills

tools:
  bash:
    # Automatic default: enabled on Linux/macOS, disabled elsewhere.
    # Set true or false to override the platform default.
    # enabled: true
    timeout_seconds: 120
  powershell:
    # Automatic default: enabled on Windows, disabled elsewhere.
    # Set true or false to override the platform default.
    # enabled: true
    timeout_seconds: 120
