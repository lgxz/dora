model:
  provider: deepseek
  # Defaults shown for reference:
  # api: chat_completions
  # name: deepseek-v4-flash
  # base_url: https://api.deepseek.com
  # api_key_env: DEEPSEEK_API_KEY

agent:
  max_model_calls: 64

# Dora automatically discovers a skills directory beside this file.
# Add other directories only when needed:
# skills:
#   directories:
#     - /absolute/path/to/additional-skills

tools:
  bash:
    # Bash is enabled by default. Uncomment to disable it.
    # enabled: false
    timeout_seconds: 30
  powershell:
    # PowerShell is enabled by default. Uncomment to disable it.
    # enabled: false
    timeout_seconds: 30
