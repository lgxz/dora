model:
  # Omit provider to select the sole provider whose API key environment
  # variable is set. Multiple detected providers require an explicit choice.
  provider: deepseek
  # Defaults shown for reference:
  # api: chat_completions
  # name: deepseek-v4-flash
  # base_url: https://api.deepseek.com
  # api_key_env: DEEPSEEK_API_KEY
  # Other presets: openai, trust

  # Overall timeout (seconds) for a non-streaming generation request.
  # Default: 120.
  # timeout_seconds: 120
  # Timeout (seconds) for establishing the TCP connection. Default: 10.
  # connect_timeout_seconds: 10
  # Maximum idle time (seconds) between streaming events before the stream is
  # considered stalled. 0 disables the idle timeout and leaves the stream
  # governed by the caller's context. Default: 0.
  # stream_idle_timeout_seconds: 0

  # Cap the number of tokens the model is allowed to generate in one response.
  # Default: 32768. Sent to the provider on the wire: max_tokens for the
  # chat_completions API and max_output_tokens for the responses API. An
  # explicit 0 means "no explicit cap" and is sent as-is.
  # max_tokens: 32768
  # Sampling randomness in [0, 2]. Unset sends no value and leaves it to the
  # provider default sampling. Some reasoning/tool-calling models ignore or
  # reject non-default values.
  # temperature: 1.0
  # Model "thinking mode" reasoning effort: off | minimal | low | medium | high.
  # Nil leaves it to the provider default. Values the provider does not support
  # are silently ignored (not sent). The deepseek preset defaults to off;
  # set thinking here to override.
  # thinking: off

  # Enable image understanding. Requires a vision-capable model. When true,
  # command tools advertise the @@path@@ image tag and --image is accepted.
  # Default: false.
  # vision: true

agent:
  max_rounds: 256
  # Bound the number of recent rounds sent to the model each iteration.
  # Default: 32. With compaction enabled, max_rounds can be raised to allow
  # longer tool loops without unbounded context growth.
  # max_history_rounds: 32
  # Bound the total text budget (in bytes) for the messages sent to the model.
  # Historical rounds are compressed (images dropped, oversized content
  # truncated) so the total stays within this budget. Default: 1048576 (1 MiB).
  # context_window: 1048576

# Dora automatically discovers skills at ~/.dora/skills (or DORA_HOME/skills)
# followed by ~/.agents/skills/, independent of this file's location. Absent
# default directories are silently skipped. Setting skills.directories replaces
# the defaults with exactly these parent directories; each path must be an
# absolute path or start with ~/:
# skills:
#   directories:
#     - /absolute/path/to/additional-skills

tools:
  bash:
    # Automatic default: enabled on Linux/macOS, disabled elsewhere.
    # Set true or false to override the platform default.
    # enabled: true
    timeout_seconds: 120
  powershell:
    # Automatic default: enabled on Windows, disabled elsewhere.
    # Set true or false to override the platform default.
    # enabled: true
    timeout_seconds: 120
