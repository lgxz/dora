# Providers are a catalog. The embedded catalog gives deepseek and trust
# built-in base_url defaults, so that field may be omitted for them. Custom
# providers must set base_url. API keys are read from the provider-derived
# environment variable (for example DEEPSEEK_API_KEY or TRUST_API_KEY), with
# config-local fallbacks available under env. Model selection is driven by
# per-capability policy (see policy below). Values in env are not exported to
# child processes.
providers:
  - name: deepseek
    # base_url: https://api.deepseek.com
    # api: chat_completions
    # timeout_seconds: 120
    # connect_timeout_seconds: 10
    # stream_idle_timeout_seconds: 0
    profiles:
      # name is the unique profile name used by policy.profile. model is the
      # identifier sent to the provider and defaults to name when omitted.
      # capabilities advertises what this profile supports: text (always for a
      # chat model) and image_input for vision-capable models.
      - name: deepseek-v4-flash
        # Defaults: model: deepseek-v4-flash, max_tokens: 32768.
        # Approximate context capacity in message-content bytes. Default:
        # 1048576 (1 MiB). Must be positive.
        context_window: 1048576
        capabilities: [text]
      - name: deepseek-reasoning
        model: deepseek-v4-flash
        thinking: high
        capabilities: [text]
  - name: trust
    # base_url: https://api.trustoken.cn/v1
    profiles:
      - name: deepseek-v4-flash
        context_window: 1048576
        capabilities: [text]
      - name: deepseek-v4-pro
        context_window: 1048576
        capabilities: [text]

# Optional config-local API keys. A real process environment variable with the
# same name takes precedence.
# env:
#   DEEPSEEK_API_KEY: sk-...
#   TRUST_API_KEY: sk-...

# Per-capability model policy. Each key is an optional {provider, profile};
# absence means auto (the router picks the first catalog entry satisfying the
# capability). text maps to [text]; image maps to [image_input]. Environment
# overrides are DORA_POLICY_TEXT_PROVIDER, DORA_POLICY_TEXT_PROFILE,
# DORA_POLICY_IMAGE_PROVIDER, and DORA_POLICY_IMAGE_PROFILE.
policy:
  text:
    provider: deepseek
    profile: deepseek-v4-flash
  # image: {}   # auto; requires a model advertising capabilities: [image_input]

agent:
  max_rounds: 256

# Event daemon. When events.enabled is true, dora runs as a long-running
# daemon that processes inbound events. Phase one supports only the memberlist
# transport.
# events:
#   enabled: true
#   transports:
#     memberlist:
#       bind: 0.0.0.0:8848   # host:port to bind; default 0.0.0.0:8848
#       name: dora           # memberlist node name; default derived from bind
#       # join:              # existing nodes to join on startup (host:port each)
#       #   - 10.0.0.2:8848
#       #   - 10.0.0.3:8848

# Dora automatically discovers skills at ~/.dora/skills (or DORA_HOME/skills)
# followed by ~/.agents/skills/, independent of this file's location. Absent
# default directories are silently skipped. Setting skills.directories replaces
# the defaults with exactly these parent directories; each path must be an
# absolute path or start with ~/:
# skills:
#   directories:
#     - /absolute/path/to/additional-skills

tools:
  bash:
    # Automatic default: enabled on Linux/macOS, disabled elsewhere.
    # Set true or false to override the platform default.
    # enabled: true
    timeout_seconds: 120
  powershell:
    # Automatic default: enabled on Windows, disabled elsewhere.
    # Set true or false to override the platform default.
    # enabled: true
    timeout_seconds: 120
